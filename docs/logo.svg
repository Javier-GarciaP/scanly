<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="256" height="256">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172542" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090E1A" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="scanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="sheetSweep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="236" fill="url(#bgGrad)" />

  <g transform="translate(0,0) scale(1.0)">
    <!-- Subtle cobalt scan glow underneath beam -->
    <rect x="336" y="538" width="352" height="128" rx="14" fill="url(#scanGlow)" />

    <!-- Viewfinder corner brackets -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.94" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 212 344 L 212 256 Q 212 212 256 212 L 344 212" />
      <path d="M 680 212 L 768 212 Q 812 212 812 256 L 812 344" />
      <path d="M 212 680 L 212 768 Q 212 812 256 812 L 344 812" />
      <path d="M 680 812 L 768 812 Q 812 812 812 768 L 812 680" />
    </g>

    <!-- Document sheet with folded corner -->
    <path d="M 378 286 L 578 286 L 680 388 L 680 704 Q 680 738 646 738 L 378 738 Q 344 738 344 704 L 344 320 Q 344 286 378 286 Z" fill="#FFFFFF" />
    <!-- Folded corner triangle -->
    <path d="M 578 286 L 680 388 L 606 388 Q 578 388 578 360 Z" fill="#CBD5E1" />

    <!-- Minimal document text bars -->
    <rect x="404" y="382" width="128" height="28" rx="14" fill="#CBD5E1" />
    <rect x="404" y="440" width="212" height="28" rx="14" fill="#E2E8F0" />

    <!-- Subtle blue scan wash on lower sheet -->
    <path d="M 344 548 L 680 548 L 680 704 Q 680 738 646 738 L 378 738 Q 344 738 344 704 Z" fill="url(#sheetSweep)" />

    <!-- Signature Cobalt Scan Beam -->
    <rect x="248" y="514" width="528" height="48" rx="24" fill="url(#beamGrad)" />
    <!-- Crisp inner highlight on beam -->
    <rect x="276" y="526" width="472" height="10" rx="5" fill="#93C5FD" opacity="0.65" />
  </g>
</svg>
